description: Prepares the repo for a typical CI job

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        cache: pnpm
        node-version: 24.3.0
        registry-url: https://registry.npmjs.org
    - run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
